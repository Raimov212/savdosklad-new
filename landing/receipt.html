<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 80mm auto; margin: 0; }
        body { 
            width: 80mm; 
            margin: 0; 
            padding: 5mm; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px; 
            line-height: 1.4;
            color: #000;
        }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .dashed-line { border-bottom: 1px dashed #000; margin: 8px 0; }
        
        .header .title { font-size: 20px; margin-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; border-bottom: 1px solid #000; padding-bottom: 5px; }
        td { padding: 5px 0; }
        
        .totals { margin-top: 10px; font-size: 16px; }
        .total-row { display: flex; justify-content: space-between; margin: 3px 0; }
        
        /* QR kod uchun joy */
        .qr-container { margin: 20px auto; text-align: center; }
        #receipt-qr { width: 150px; height: 150px; object-fit: contain; display: none; margin: 0 auto; }
        .qr-placeholder { 
            width: 150px; height: 150px; border: 1px dashed #ccc; 
            margin: 0 auto; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #999;
        }

        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div id="print-area">
        <div class="header center">
            <div class="title bold">"SAVDOSKLAD" MCHJ</div>
            <div>Toshkent sh., Chilonzor tumani</div>
            <div>Tel: +998 90 123 45 67</div>
        </div>

        <div class="dashed-line"></div>

        <div class="center">
            <span>Sana: 01.05.2026</span> &nbsp; <span>Vaqt: 16:50</span>
        </div>

        <div class="dashed-line"></div>

        <table>
            <thead>
                <tr>
                    <th>Nomi</th>
                    <th style="text-align: right;">Jami</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Coca-Cola 1.5L <br><small>2 x 12,000</small></td>
                    <td style="text-align: right;">24,000</td>
                </tr>
                <tr>
                    <td>Choco-Pie 12pcs <br><small>1 x 35,000</small></td>
                    <td style="text-align: right;">35,000</td>
                </tr>
            </tbody>
        </table>

        <div class="dashed-line"></div>

        <div class="totals">
            <div class="total-row">
                <span>Oraliq jami:</span>
                <span>59,000</span>
            </div>
            <div class="total-row bold" style="font-size: 20px;">
                <span>JAMI:</span>
                <span>59,000</span>
            </div>
        </div>

        <!-- Terminal QR-kodi shu yerda chiqadi -->
        <div class="qr-container">
            <img id="receipt-qr" src="" alt="QR Code">
            <div id="qr-empty" class="qr-placeholder">QR-kod rasmini yuklang</div>
        </div>

        <div class="center bold" style="margin-top: 10px;">
            Xaridingiz uchun rahmat!
        </div>
    </div>

    <!-- Yuklash va Print tugmalari (faqat ekranda ko'rinadi) -->
    <div class="no-print" style="margin-top: 30px; padding: 20px; border-top: 1px solid #ddd; background: #f9f9f9;">
        <p><b>Terminal QR-kodini yuklang:</b></p>
        <input type="file" id="qr-input" accept="image/*" style="margin-bottom: 15px;">
        <br>
        <button onclick="window.print()" style="padding: 15px 30px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            🖨 Xprinterda chop etish
        </button>
    </div>

    <script>
        // Rasmni yuklash va chekda ko'rsatish logikasi
        document.getElementById('qr-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('receipt-qr');
                    img.src = event.target.result;
                    img.style.display = 'block';
                    document.getElementById('qr-empty').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
